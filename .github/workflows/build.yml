name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk rpm

      - name: Установка Python-зависимостей
        run: |
          pip install --upgrade pip
          pip install -r server/requirements.txt pyinstaller

      - name: Разрешить выполнение скриптов сборки
        run: chmod +x scripts/build/build.sh scripts/build/create-release.sh scripts/build/build-deb.sh scripts/build/build-rpm.sh

      - name: Сборка standalone-бинарника
        run: ./scripts/build/build.sh

      - name: Упаковка архива релиза
        run: ./scripts/build/create-release.sh

      - name: Сборка .deb-пакета
        run: ./scripts/build/build-deb.sh

      - name: Сборка .rpm-пакета
        run: ./scripts/build/build-rpm.sh

      - name: Копирование .rpm в releases/
        run: |
          mkdir -p releases
          find "$HOME/rpmbuild/RPMS" -name "*.rpm" -exec cp {} releases/ \;

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            releases/*.tar.gz
            releases/*.deb
            releases/*.rpm
          retention-days: 7



  build-macos-intel:
    runs-on: macos-15

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Проверка tkinter
        run: python3 -c "import tkinter; print('tkinter OK')"

      - name: Установка Python-зависимостей
        run: |
          pip install --upgrade pip
          pip install -r server/requirements.txt pyinstaller

      - name: Разрешить выполнение скриптов сборки
        run: chmod +x scripts/build/build.sh scripts/build/create-release.sh scripts/build/build-pkg.sh

      - name: Сборка standalone-бинарника
        run: ./scripts/build/build.sh

      - name: Упаковка архива релиза
        run: ./scripts/build/create-release.sh

      - name: Сборка .pkg-пакета
        run: ./scripts/build/build-pkg.sh

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-artifacts
          path: |
            releases/*.tar.gz
            releases/*.pkg
          retention-days: 7

  build-macos-arm:
    runs-on: macos-15

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Проверка tkinter
        run: python3 -c "import tkinter; print('tkinter OK')"

      - name: Установка Python-зависимостей
        run: |
          pip install --upgrade pip
          pip install -r server/requirements.txt pyinstaller

      - name: Разрешить выполнение скриптов сборки
        run: chmod +x scripts/build/build.sh scripts/build/create-release.sh scripts/build/build-pkg.sh

      - name: Сборка standalone-бинарника
        run: ./scripts/build/build.sh

      - name: Упаковка архива релиза
        run: ./scripts/build/create-release.sh

      - name: Сборка .pkg-пакета
        run: ./scripts/build/build-pkg.sh

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-artifacts
          path: |
            releases/*.tar.gz
            releases/*.pkg
          retention-days: 7

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Установка Inno Setup
        run: choco install innosetup -y

      - name: Установка Python-зависимостей
        run: |
          pip install --upgrade pip
          pip install -r server/requirements.txt pyinstaller

      - name: Сборка standalone-бинарника
        run: powershell -ExecutionPolicy Bypass -File scripts/build/build.ps1

      - name: Определение версии
        id: version
        run: |
          $version = python -c "import sys; sys.path.insert(0,'server'); from server.version import __version__; print(__version__)"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Сборка установщика
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=${{ steps.version.outputs.version }} scripts/installer/flowlink-installer.iss

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            releases/FlowLink-Proxy-*-Setup.exe
          retention-days: 7

  build-crx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Восстановление ключа
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::error::Секрет CRX_PRIVATE_KEY не задан. Добавьте его в настройках репозитория (Settings → Secrets)."
            exit 1
          fi
          mkdir -p scripts/crx
          printf '%s' "$CRX_PRIVATE_KEY" > scripts/crx/crx-private-key.pem
      - name: Сборка CRX
        run: bash scripts/crx/build-crx.sh
      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: crx-artifact
          path: |
            releases/FlowLink-Proxy-*.crx
            releases/FlowLink-Proxy-*.zip
          retention-days: 7

  create-release:
    needs: [build-linux, build-macos-intel, build-macos-arm, build-windows, build-crx]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    permissions:
      contents: write
      actions: read

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверка статуса всех джоб
        run: |
          if [ "${{ needs.build-linux.result }}" != "success" ] || \
             [ "${{ needs.build-macos-intel.result }}" != "success" ] || \
             [ "${{ needs.build-macos-arm.result }}" != "success" ] || \
             [ "${{ needs.build-windows.result }}" != "success" ] || \
             [ "${{ needs.build-crx.result }}" != "success" ]; then
            echo "::warning::Одна или несколько сборочных джоб завершились с ошибкой — релиз не создаётся"
            exit 0
          fi
          echo "RELEASE_READY=true" >> "$GITHUB_ENV"

      - name: Определение версии из тега
        if: env.RELEASE_READY == 'true'
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(python3 -c "import sys; sys.path.insert(0,'server'); from server.version import __version__; print(__version__)" 2>/dev/null || echo "0.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Загрузка всех артефактов
        if: env.RELEASE_READY == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          github-token: ${{ github.token }}

      - name: Сборка артефактов
        if: env.RELEASE_READY == 'true'
        run: |
          mkdir -p release-files
          if [ -d artifacts ]; then
            find artifacts/ -type f \( -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg" -o -name "*.exe" -o -name "*.crx" -o -name "*.zip" \) \
              -exec cp {} release-files/ \;
          else
            echo "::warning::Директория artifacts/ не найдена"
          fi

      - name: Удаление существующего релиза
        if: env.RELEASE_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${{ steps.version.outputs.version }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Создание Release
        if: env.RELEASE_READY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: RELEASE_NOTES.md
          tag_name: v${{ steps.version.outputs.version }}
          name: FlowLink Proxy v${{ steps.version.outputs.version }}
          files: release-files/*
