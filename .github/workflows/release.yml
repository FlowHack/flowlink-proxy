name: Release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      actions: read

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Определение версии из тега
        id: version
        run: |
          # 1. Пробуем взять тег из head_branch (для tag-пуша)
          TAG="${{ github.event.workflow_run.head_branch }}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "source=head_branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Fallback: определяем ближайший тег по SHA коммита
          git fetch --tags --force
          SHA="${{ github.event.workflow_run.head_sha }}"
          TAG_FROM_SHA=$(git describe --tags --abbrev=0 "$SHA" 2>/dev/null || true)
          if [[ "$TAG_FROM_SHA" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${TAG_FROM_SHA#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "source=git-describe" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Последний fallback: версия из server/version.py
          VERSION=$(python3 -c "import sys; sys.path.insert(0,'server'); from server.version import __version__; print(__version__)" 2>/dev/null || echo "0.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=version.py" >> "$GITHUB_OUTPUT"

      - name: Загрузка всех артефактов
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Сборка артефактов
        run: |
          mkdir -p release-files
          if [ -d artifacts ]; then
            find artifacts/ -type f \( -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg" -o -name "*.exe" -o -name "*.crx" -o -name "*.zip" \) \
              -exec cp {} release-files/ \;
          else
            echo "::warning::Директория artifacts/ не найдена — артефакты не были загружены"
          fi

      - name: Удаление существующего релиза (идемпотентность)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Создание Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: RELEASE_NOTES.md
          tag_name: v${{ steps.version.outputs.version }}
          name: FlowLink Proxy v${{ steps.version.outputs.version }}
          files: release-files/*
