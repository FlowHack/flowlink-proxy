<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowLink Proxy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <h1 class="title">FlowLink Proxy</h1>
      <label class="switch" id="global-toggle" title="Вкл/Выкл">
        <input type="checkbox" id="global-toggle-input">
        <span class="slider"></span>
      </label>
    </header>

    <div id="update-banner" class="update-banner hidden">
      <span id="update-text"></span>
      <a id="btn-update-download" class="btn-small" target="_blank" rel="noopener">Скачать</a>
      <button id="btn-update-help" class="btn-small">Как обновить?</button>
      <button id="btn-update-close" class="btn-icon" title="Закрыть">✕</button>
    </div>

    <div id="status-bar" class="status-bar hidden">
      <span id="status-icon" class="status-icon">&#9679;</span>
      <span id="status-text" class="status-text"></span>
      <button id="btn-ping-all" class="btn-small">Пинг</button>
    </div>

    <!-- Баннеры ошибок и предупреждений создаются динамически через renderBanner() -->

    <div id="proxy-list" class="proxy-list">
      <div class="empty-state">Нет добавленных прокси</div>
    </div>

    <button id="btn-add-proxy" class="btn-add">+ Добавить прокси</button>

    <a class="donation-link" href="https://yoomoney.ru/to/4100119569298015" target="_blank" rel="noopener" title="Поддержать проект">❤ Поддержать проект</a>
    <div class="contact-email">Ошибки и предложения:
      <span id="contact-email" class="contact-email-link" title="Нажмите, чтобы скопировать">flowlink.proxy@atomicmail.io</span>
    </div>
    <div class="version-wrap">
      <span id="version-text"></span>
      <button id="btn-settings-toggle" class="btn-settings" title="Настройки">⚙</button>
    </div>
    <div id="settings-block" class="settings-block hidden">
      <!-- Секция: Подключение -->
      <div class="settings-section">
        <div class="settings-section-title">Подключение</div>
        <form id="settings-form">
          <div class="settings-row-item">
            <label for="settings-api-port">Порт API:</label>
            <input id="settings-api-port" class="input-settings" type="number" min="1" max="65535" value="8081">
            <button id="btn-settings-save" type="submit" class="btn-settings-save">Сохранить</button>
          </div>
        </form>
      </div>

      <!-- Секция: Браузер -->
      <div class="settings-section">
        <div class="settings-section-title">Браузер</div>
        <div class="settings-row-item">
          <label class="settings-checkbox-label">
            <input type="checkbox" id="browser-autostart-toggle" class="settings-checkbox">
            <span>Автозапуск браузера</span>
          </label>
        </div>
        <div id="browser-autostart-fields" class="browser-autostart-fields hidden">
          <div class="settings-row-item browser-config-settings">
            <label class="autostart-label" for="browser-select">Браузер:</label>
            <select id="browser-select" class="input-settings browser-select"></select>
          </div>
          <div class="settings-row-item browser-path-settings">
            <label class="autostart-label" for="browser-path-input">Путь:</label>
            <input id="browser-path-input" class="input-settings" type="text" placeholder="Путь к исполняемому файлу">
            <button id="btn-browser-path-save" type="button" class="btn-settings-save">Сохранить</button>
          </div>
          <div id="browser-path-error" class="browser-path-error hidden"></div>
        </div>
      </div>

      <!-- Секция: Система -->
      <div class="settings-section">
        <div class="settings-section-title">Система</div>
        <div class="settings-row-item">
          <label class="settings-checkbox-label">
            <input type="checkbox" id="system-autostart-toggle" class="settings-checkbox">
            <span>Запуск с системой</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно: помощь с настройкой -->
  <div id="modal-help" class="modal-overlay hidden">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 class="modal-title">Настройка FlowLink Proxy</h2>
        <button id="btn-help-close" class="btn-icon" title="Закрыть">✕</button>
      </div>
      <div id="modal-tabs" class="help-tabs">
        <button id="tab-windows" class="help-tab active">Windows</button>
        <button id="tab-linux" class="help-tab">Linux</button>
        <button id="tab-macos" class="help-tab">macOS</button>
        <button id="tab-source" class="help-tab">Исходный код</button>
        <button id="tab-port" class="help-tab">Настройка порта</button>
      </div>
      <div class="modal-body help-content" id="help-content">
        <!-- заполняется JS -->
      </div>
      <div class="modal-actions">
        <button id="btn-help-close2" class="btn btn-secondary">Закрыть</button>
      </div>
    </div>
  </div>

  <div id="modal-proxy" class="modal-overlay hidden">
    <div class="modal">
      <form id="proxy-form">
        <div class="modal-header">
          <h2 id="modal-proxy-title" class="modal-title">Добавить прокси</h2>
        </div>
        <div class="modal-body">
          <input id="proxy-id" type="hidden">
          <div class="field-group">
            <input id="proxy-host" class="input" type="text" placeholder="IP адрес" autocomplete="off">
            <div id="proxy-host-error" class="field-error hidden"></div>
          </div>
          <div class="field-group">
            <input id="proxy-port" class="input" type="number" placeholder="Порт" min="1" max="65535">
            <div id="proxy-port-error" class="field-error hidden"></div>
          </div>
          <div class="field-group">
            <input id="proxy-username" class="input" type="text" placeholder="Логин" autocomplete="off">
            <div id="proxy-username-error" class="field-error hidden"></div>
          </div>
          <div class="field-group password-field">
            <div class="password-wrap">
              <input id="proxy-password" class="input input--password" type="password" placeholder="Пароль" autocomplete="off">
              <button id="btn-password-toggle" class="btn-password-toggle" type="button" title="Показать пароль">
                <svg class="eye-icon eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
                <svg class="eye-icon eye-open hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div id="proxy-password-error" class="field-error hidden"></div>
          </div>
          <div class="field-group">
            <input id="proxy-label" class="input" type="text" placeholder="Название (необязательно)" autocomplete="off" maxlength="21">
            <div id="proxy-label-error" class="field-error hidden"></div>
          </div>
        </div>
        <div class="modal-actions">
          <button id="btn-proxy-cancel" type="button" class="btn btn-secondary">Отменить</button>
          <button id="btn-proxy-save" type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-masks" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Маски</h2>
        <button id="btn-clear-masks" class="btn btn-secondary flex-shrink-0" type="button">Очистить</button>
      </div>
      <div class="modal-body modal-body--masks">
        <div id="mask-list" class="mask-list">
          <div class="empty-state small">Нет масок</div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-add-mask" class="btn btn-primary">+ Добавить маску</button>
        <button id="btn-masks-close" class="btn btn-secondary">Закрыть</button>
      </div>
    </div>
  </div>

  <div id="modal-mask" class="modal-overlay hidden">
    <div class="modal">
      <form id="mask-form">
        <div class="modal-header">
          <h2 id="modal-mask-title" class="modal-title">Добавить маску</h2>
        </div>
        <div class="modal-body">
          <input id="mask-id" type="hidden">
          <input id="mask-pattern" class="input" type="text" placeholder='Например: *gemini.google.com* или *.google.com' autocomplete="off">
          <div id="mask-error" class="field-error hidden"></div>
        </div>
        <div class="modal-actions">
          <button id="btn-mask-cancel" type="button" class="btn btn-secondary">Отменить</button>
          <button id="btn-mask-save" type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
