# Конфигурация инструментов разработки проекта FlowLink Proxy.
# Пока используется только для pytest; pylint и pyright конфигурируются
# флагами командной строки / отдельными файлами.

[tool.pytest.ini_options]
# Корень поиска тестов: только серверные тесты (JS-тесты запускаются node)
testpaths = ["server/tests"]
# Обеспечивает импорт `server.*` при запуске pytest из корня проекта
pythonpath = ["."]
# Краткий вывод по умолчанию; полный — через `pytest -v`
addopts = "-q"
